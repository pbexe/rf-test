name: Robot Framework Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        
    - name: Setup Chrome Driver
      uses: nanasess/setup-chromedriver@v2
      
    - name: Run Robot Framework Tests
      run: |
        robot --outputdir results --loglevel INFO tests/
      continue-on-error: true
      
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: robot-framework-results
        path: |
          results/
          
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: results/output.xml
        check_name: Robot Framework Test Results
        
    - name: Upload Test Report
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "Test execution completed. Check the uploaded artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
        if [ -f "results/report.html" ]; then
          echo "📊 **Report:** Available in artifacts" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "results/log.html" ]; then
          echo "📋 **Log:** Available in artifacts" >> $GITHUB_STEP_SUMMARY
        fi